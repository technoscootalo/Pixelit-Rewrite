<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer"
    />

    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link rel="stylesheet" href="/styles/home.css">
    <title>Pixelit</title>

    <meta name="description" content="Pixelit is an online pixels collecting game. Claim daily tokens, open packs, unlock pixels and earn tokens." />
    <meta name="keywords" content="Pixelit, pixels collecting game, pixels, open packs, claim daily, unlock pixels, token earning, leaderboard, free online game" />
    <meta name="author" content="Pixelit" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://izumiihd.xyz/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://izumiihd.xyz/" />
    <meta property="og:site_name" content="Pixelit" />
    <meta property="og:title" content="Pixelit - The 1st ever Pixelated Blooket Private Server, Rewritten in NodeJS." />
    <meta name="description" content="Pixelit is an online pixels collecting game. Claim daily tokens, open packs, unlock pixels and earn tokens." />
    <meta name="twitter:image" content="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://izumiihd.xyz/" />
    <meta name="twitter:title" content="Pixelit - The 1st ever Pixelated Blooket Private Server, Rewritten in NodeJS." />
    <meta name="description" content="Pixelit is an online pixels collecting game. Claim daily tokens, open packs, unlock pixels and earn tokens." />
    <meta name="twitter:image" content="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico" />

    <style>
        @font-face { font-family: 'DaydreamWeb'; src: url('/styles/Daydream DEMO.otf') format('opentype');}

        body {
            margin: 0;
            padding: 0;
            background: #6f0083;
            color: white;
            font-family: Pixelify Sans;
        }

        @keyframes blooks {
            0% {
                transform: translateY(-1rem) rotate(1deg);
            }
            50% {
                transform: translateY(1rem) rotate(0deg);
            }
            100% {
                transform: translateY(-1rem) rotate(1deg);
            }
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            font-family: 'Daydream', sans-serif;
        }

        main {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .terms {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 1rem;
            font-weight: bold;
        }

        .terms a {
            color: white;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .copyright {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-size:14px;
        }

        .copyright a {
            color: white;
            text-decoration: none;
        }

        .text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            flex: 1;
            text-shadow: #000 1px 0 13px;
        }

        .blooks {
            display: flex;
            flex: 2;
            align-items: center;
            justify-content: center;
        }

        .blooks img {
            width: 70%;
            animation: blooks 10s ease infinite;
            filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.5));
        }

        .mobileBlook {
            display: none;
        }

        .subheading {
            font-size: 2rem;
            text-shadow: #000 1px 0 13px;
        }

        @media (max-width: 636px) {
            .terms {
                display: none;
            }

            h1 {
                font-size: 4rem;
                margin-bottom: 380px;
            }

            .blooks {
                display: none;
            }

            .blooks img {
                display: none;
            }

            .mobileBlook { 
                display: flex; 
                justify-content: center; 
                align-items: center; 
                height: 85dvh; 
                width: 100vw; 
                position: fixed;
                top: 0;
                left: 0;
            } 

            .mobileBlook img { 
                width: 60%; 
                animation: blooks 10s ease infinite; 
                filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.5)); 
            }
            
            .text {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                justify-content: center;
                text-shadow: #000 1px 0 13px;
            }

            .copyright { 
                display: none;
            }

            .buttons {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .discordButton {
                flex: 1;
                width: 19vh;
                height: 7.5vh;
                border: none;
                border-radius: 10px;
                font-family: 'Pixelify Sans', sans-serif;
                font-size: 24px;
                font-weight: 800;
                cursor: pointer;
                background: #FFFFFF;
                color: #3a3a3a;
                box-shadow: 0 -5px #0003 inset,0 0 4px #00000026;
                border: 2px solid rgba(255, 255, 255, 0.85);
            }

            .registerButton{
                flex: 1;
                width: 19vh;
                height: 7.5vh;
                border: none;
                border-radius: 10px;
                font-family: 'Pixelify Sans', sans-serif;
                font-size: 28px;
                font-weight: 800;
                cursor: pointer;
                background: #5e046e;
                color: white;
                box-shadow: inset 0 -0.365vw #53055c, 3px 3px 14px rgba(0,0,0,0.5);
                border: 2px solid rgba(255, 255, 255, 0.85);
            }

            .registerButton:hover,
            .discordButton:hover {
                filter: brightness(1.08);
            }

        }
    </style>

</head>

<body>
    <img alt="Background" class="background" />
    <main>
        <div class="text">
            <h1>Pixelit</h1>
            <br />
            <h2 class="subheading">
                The #1 Pixelated Web Trading Game
                <br />
                Rebuilt entirely in <color>NodeJS.</color>
            </h2>
            <br />
            <div class="buttons">
                <button                 
                    onclick="window.location.href='/register'"
                    class="registerButton" >
                    Register
                </button>
                <button                 
                    onclick="window.open('https://discord.gg/jRJVFYyJJj', '_blank')"
                    class="discordButton" >
                    Discord
                </button>
            </div>
        </div>

        <div class="blooks">
            <img 
                src="https://technoscootalo.github.io/pixelitcdn-1/assets/img/home/homeBlooks.png"
                alt="Home blooks"
                onclick="window.location.href='/register'"
                style="cursor: pointer;"
            >
        </div>
        <div class="mobileBlook">
            <img 
                src="https://izumiihd.github.io/pixelitcdn/assets/img/blooks/OG/IzumiiHD.png"
                alt="Home blooks"
                onclick="window.location.href='/register'"
                style="cursor: pointer;"
            >
        </div>
        <span class="copyright">
            <a>© 2023 Pixelit LLC. All Rights Reserved.</a>
        </span>

        <span class="terms">
            Running version 3.0.0 •  
            <a href="/terms">Terms of Service</a>
        </span>
    </main>

</body>
</html>
