<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link rel="stylesheet" href="/styles/home.css">
    <title>Home</title>

    <meta name="twitter:card" content="large_image" />
    <meta name="twitter:url" content="https://dev.izumiihd.xyz/" />
    <meta name="twitter:title" content="Pixelit" />
    <meta name="twitter:description" content="The very first BPS with pixels. Rewritten entirely in Node JS" />
    <meta name="twitter:image" content="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico" />


    <style>
        body {
            margin: 0;
            padding: 0;
            background: #6f0083;
            color: white;
            font-family: Pixelify Sans;
            overflow: hidden;
        }

        @keyframes blooks {
            0% {
                transform: translateY(-1rem) rotate(1deg);
            }
            50% {
                transform: translateY(1rem) rotate(0deg);
            }
            100% {
                transform: translateY(-1rem) rotate(1deg);
            }
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        main {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .terms {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 1rem;
            font-weight: bold;
        }

        .terms a {
            color: white;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            flex: 1;
            text-shadow: #000 1px 0 13px;
        }

        .blooks {
            display: flex;
            flex: 2;
            align-items: center;
            justify-content: center;
        }

        .blooks img {
            width: 70%;
            animation: blooks 10s ease infinite;
            filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.5));
        }

        .subheading {
            font-size: 2rem;
            text-shadow: #000 1px 0 13px;
        }
    </style>
    <script src="/js/loadingModal.js"></script>
</head>
<body>
    <img alt="Background" class="background" />
    <main>
        <div class="text">
            <h1>Pixelit</h1>
            <br />
            <h2 class="subheading">
                The very first BPS with pixels
                <br />
                Rewritten entirely in <color>Node JS</color>
            </h2>
        </div>

        <div class="blooks">
            <img 
                src="https://technoscootalo.github.io/pixelitcdn-1/assets/img/home/homeBlooks.png"
                alt="Home blooks"
                onclick="window.location.href='/register'"
                style="cursor: pointer;"
            >
        </div>

        <span class="terms">
            Running version 3.0.0 •  
            <a href="/terms">Terms of Service</a>
        </span>
    </main>

</body>
</html>
