<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats</title>

  <link rel="stylesheet" href="/styles/stats.css">
  <link rel="stylesheet" href="/styles/navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  
  <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">
  </head>

<body>

<nav>
  <h1 class="logo"
    onclick="window.location.href='/'"
    style="cursor:pointer; transition:0.2s;"
    onmouseover="this.style.opacity='0.7'"
    onmouseout="this.style.opacity='1'">
    Pixelit
  </h1>
  
  <div class="profile-container">
    <div class="profile-row">
      <img src="https://izumiihd.github.io/pixelitcdn/assets/img/blooks/logo.png" id="profilePic" class="profile-pic" alt="Profile" />
      <span class="profile-name" id="profileName">User</span>
      <i class="fa-solid fa-chevron-down profile-arrow"></i>
    </div>
    <div class="profile-dropdown-menu">
      <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="/" onclick="handleLogout(event)">
        <i class="fa-solid fa-sign-out-alt"></i> Logout
      </a>   
    </div>
  </div>
  
  <div class="icons">
    <a href="/stats"><i class="fa-solid fa-chart-column"></i> Stats</a>
    <a href="/chat"><i class="fa-solid fa-comments"></i> Chat</a>
    <a href="/ranking"><i class="fa-solid fa-trophy"></i> Ranking</a>
    <a href="/market"><i class="fa-solid fa-store"></i> Market</a>
    <a href="/pixels"><i class="fa-solid fa-suitcase"></i> Pixels</a>
    <a href="/inventory"><i class="fa-solid fa-box-open"></i> Inventory</a>
    <a href="#" id="newsBtn"><i class="fa-solid fa-newspaper"></i> News</a>   
    <a href="/panel" id="panelLink"><i class="fa-solid fa-wrench"></i> Panel</a>
    <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="/credits"><i class="fa-solid fa-heart"></i> Credits</a>
  </div>

  <div class="buttonGap"></div>
    <a href="https://discord.gg/jRJVFYyJJj" target="_blank" class="discord" title="Join our Discord">
  
  <div class="bottomIcons">
      <i class="fa-brands fa-discord"></i>
    </a>
    <a href="https://github.com/technoscootalo/Pixelit-Rewrite" target="_blank" class="github" title="Visit our Github">
      <i class="fa-brands fa-github"></i>
    </a>
    <a href="/store"  class="store">
      <i class="fa-solid fa-cart-shopping"></i>
    </a>
  </div>
</nav>

<div class="background"></div>

<div id="newsSidebarOverlay"></div>

<aside id="newsSidebar" class="news-sidebar" aria-hidden="true">
  <div class="news-sidebar-header">
    <div class="news-sidebar-header-title">
      <i class="far fa-newspaper" aria-hidden="true"></i>
      <span><span class="pixelitLogo">Pixelit</span> News</span>
    </div>

    <button
      type="button"
      class="news-sidebar-close"
      data-news-sidebar-close
      aria-label="Close news"
    >
      &times;
    </button>
  </div>
  <div class="news-sidebar-content">
    <div id="newsSidebarArticles"></div>
  </div>
</aside>

<div class="main_container">

  <br><br>

  <div class="profile_container">
    <img src="https://izumiihd.github.io/pixelitcdn/assets/img/blooks/logo.png" 
      id="pfp" 
      style="transition: transform 0.2s ease-in-out;"
        onmouseover="this.style.transform = 'scale(0.9)';"
        onmouseout="this.style.transform = 'scale(1)';"
        onmousedown="this.style.transform = 'scale(0.8)';"
        onmouseup="this.style.transform = 'scale(1)';"
    />

    <div class="banner-container">
      <img src="https://izumiihd.github.io/pixelitcdn/assets/img/banner/pixelitBanner.png" 
        id="banner" 
          style="transition: transform 0.2s ease-in-out;"
          onmouseover="this.style.transform = 'scale(0.9)';"
          onmouseout="this.style.transform = 'scale(1)';"
          onmousedown="this.style.transform = 'scale(0.8)';"
          onmouseup="this.style.transform = 'scale(1)';"        
      />

      <div id="username">Loading...</div>
      <div id="role">Loading...</div>
    </div>
  </div>

  <div class="button_container">
    <button class="button viewUser">
      <i class="fa-solid fa-magnifying-glass"></i>
      View Stats
    </button>

    <button id="spinButton" class="button spin">
      <i class="fa-solid fa-star"></i>
      Daily Wheel
    </button>
    <div id="dailyWheelMessage" style="margin-top: 12px; color: #fff; font-size: 0.95rem;"></div>
  </div>

  <div id="viewUserError" style="color: red; margin-top: 10px; display: none;"></div>

  <div style="display: flex; justify-content: space-between; width: 100%">
    <div class="stat_box">
      <div class="stat_header">
        Stats
      </div>
      <div class="inboxButton">
        <i class="fa-solid fa-inbox"></i>
      </div>
      <div class="inner_stat_container">
        <div class="token_stat_box">
          <div style="text-align: center;">
            <span style="font-size: 20px;">Tokens</span>
            <br />
            <span id="tokens" style="margin-left: 10px;  font-weight: bold; font-size: 28px;">loading...</span>
          </div>
          <img
            src="https://izumiihd.github.io/pixelitcdn/assets/img/icons/token.png"
            alt="token"
            class="token"
          />
        </div>
        <br />
        <div class="info_stat_box">
          <div style="text-align: center;">
            <span style="font-size: 20px;">Packs Opened</span>
            <br />
            <span id="opened" style="margin-left: 10px;  font-weight: bold; font-size: 28px;">loading...</span>
          </div>
          <img
            src="https://izumiihd.github.io/pixelitcdn/assets/img/icons/unlocked.png"
            alt="unlocked"
            class="lock"
          />
        </div>
        <br />
        <div class="info_stat_box">
          <div style="text-align: center;">
            <span style="font-size: 20px;">Messages</span>
            <br />
            <span id="messages" style="margin-left: 10px;  font-weight: bold; font-size: 28px;">loading...</span>
          </div>
          <img
            src="https://izumiihd.github.io/pixelitcdn/assets/img/icons/speech.png"
            alt="Messages"
            class="speechBubble"
          />
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mobile_nav">
  <a href="/stats" class="active">
    <i class="fa-solid fa-chart-column"></i>
    <span>Stats</span>
  </a>

  <a href="/chat">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </a>

  <a href="/ranking">
    <i class="fa-solid fa-trophy"></i>
    <span>Ranking</span>
  </a>

  <a href="/market">
    <i class="fa-solid fa-store"></i>
    <span>Market</span>
  </a>

  <a href="/pixels">
    <i class="fa-solid fa-suitcase"></i>
    <span>Pixels</span>
  </a>

  <a href="/panel" id="panelLink">
    <i class="fa-solid fa-wrench"></i>
    <span>Panel</span>
  </a>

  <a href="/settings">
    <i class="fa-solid fa-gear"></i>
    <span>Settings</span>
  </a>

  <a href="/credits">
    <i class="fa-solid fa-heart"></i>
    <span>Credits</span>
  </a>
</div>

<script src="/js/profile-dropdown.js"></script>
<script src="/js/loadingModal.js"></script>
<script src="/js/stats.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/js/newsSider.js"></script>
<script src="/js/auth/checkSession.js"></script>
<script src="/js/auth/panelAuth.js"></script>


</body>
</html>
