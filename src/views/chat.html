<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>

  <link rel="stylesheet" href="/styles/chat.css">
  <link rel="stylesheet" href="/styles/navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">
</head>

<body>

<nav>
  <h1 class="logo"
    onclick="window.location.href='/'"
    style="cursor:pointer; transition:0.2s;"
    onmouseover="this.style.opacity='0.7'"
    onmouseout="this.style.opacity='1'">
    Pixelit
  </h1>
  <br>
  
  <div class="profile-container">
    <div class="profile-row">
      <img src="" id="profilePic" class="profile-pic" alt="Profile" />
      <span class="profile-name" id="profileName">User</span>
      <i class="fa-solid fa-chevron-down profile-arrow"></i>
    </div>
    <div class="profile-dropdown-menu">
      <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="/" onclick="handleLogout(event)">
      <i class="fa-solid fa-sign-out-alt"></i> Logout
      </a>   
    </div>
  </div>
  <div class="inboxButton">
    <i class="fa-solid fa-envelope"></i>
  </div>
  <br>
  
  <div class="icons">
    <a href="/stats"><i class="fa-solid fa-chart-column"></i> Stats</a>
    <a href="/chat"><i class="fa-solid fa-comments"></i> Chat</a>
    <a href="/ranking"><i class="fa-solid fa-trophy"></i> Ranking</a>
    <a href="/market"><i class="fa-solid fa-store"></i> Market</a>
    <a href="/pixels"><i class="fa-solid fa-suitcase"></i> Pixels</a>
    <a href="/news"><i class="fa-solid fa-newspaper"></i> News</a>
    <a href="/panel" id="panelLink"><i class="fa-solid fa-wrench"></i> Panel</a>
    <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="/credits"><i class="fa-solid fa-heart"></i> Credits</a>
  </div>
  <br>
  <div class="bottomIcons">
</nav>

<div class="background"></div>

<main class="chat-page">

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
      <h2 class="chat-header-text"># General (beta chat)</h2>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">

      <div class="message">
        <img
          class="chat-pfp"
          src="https://izumiihd.github.io/pixelitcdn/assets/img/blooks/logo.png"
          alt="User Profile"
        >

        <div class="message-content">
          <strong>Loading...</strong>
          <p>Loading messages...</p>
          <small>Loading...</small>
        </div>
      </div>

    </div>

    <!-- Input -->
    <form id="chatForm" class="chat-form">
      <input
        type="text"
        id="chatInput"
        placeholder="Type a message..."
        autocomplete="off"
        maxlength="250"
        required
      />

      <button type="submit" aria-label="Send Message">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

  </div>

</main>

<div class="mobile_nav">
  <a href="/stats" class="active">
    <i class="fa-solid fa-chart-column"></i>
    <span>Stats</span>
  </a>

  <a href="/chat">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </a>

  <a href="/ranking">
    <i class="fa-solid fa-trophy"></i>
    <span>Ranking</span>
  </a>

  <a href="/market">
    <i class="fa-solid fa-store"></i>
    <span>Market</span>
  </a>

  <a href="/pixels">
    <i class="fa-solid fa-suitcase"></i>
    <span>Pixels</span>
  </a>

  <a href="/news">
    <i class="fa-solid fa-newspaper"></i>
    <span>News</span>
  </a>


  <a href="/panel" id="panelLink">
    <i class="fa-solid fa-wrench"></i>
    <span>Panel</span>
  </a>

  <a href="/settings">
    <i class="fa-solid fa-gear"></i>
    <span>Settings</span>
  </a>

  <a href="/credits">
    <i class="fa-solid fa-heart"></i>
    <span>Credits</span>
  </a>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/profile-dropdown.js"></script>
<script src="/js/auth/checkSession.js"></script>
<script src="/js/auth/panelAuth.js"></script>
<script src="/js/chat.js"></script>
</body>

</html>
