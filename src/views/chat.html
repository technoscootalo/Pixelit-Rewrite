<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>

  <link rel="stylesheet" href="/styles/chat.css">
  <link rel="stylesheet" href="/styles/navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  
  <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">
  </head>

<body>

<nav>
  <h1 class="logo"
    onclick="window.location.href='/'"
    style="cursor:pointer; transition:0.2s;"
    onmouseover="this.style.opacity='0.7'"
    onmouseout="this.style.opacity='1'">
    Pixelit
  </h1>
  <br>
  
  <div class="profile-container">
    <div class="profile-row">
      <img src="" id="profilePic" class="profile-pic" alt="Profile" />
      <span class="profile-name" id="profileName">User</span>
      <i class="fa-solid fa-chevron-down profile-arrow"></i>
    </div>
    <div class="profile-dropdown-menu">
      <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="/" onclick="logout(); return false;"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
    </div>
  </div>
  <br>
  
  <div class="icons">
    <a href="/stats"><i class="fa-solid fa-chart-column"></i> Stats</a>
    <a href="/chat"><i class="fa-solid fa-comments"></i> Chat</a>
    <a href="/ranking"><i class="fa-solid fa-trophy"></i> Ranking</a>
    <a href="/market"><i class="fa-solid fa-store"></i> Market</a>
    <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="/panel"><i class="fa-solid fa-wrench"></i> Panel</a>
  </div>
  <br>
  <div class="bottomIcons"></div>
</nav>

<div class="background"></div>

<main class="chat-page">
    <header class="chat-header">
      <div>
        <div class="page-title">Chat</div>
      </div>
    </header>

    <section class="chat-window">
      <div id="chatMessages" class="chat-messages"></div>
      <div id="chatEmpty" class="chat-empty">No messages yet. Start the conversation.</div>
    </section>

    <form id="chatForm" class="chat-input-form">
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Type your message and press Enter..." maxlength="280"></textarea>
        <button type="submit" class="chat-send-button">Send</button>
      </div>
      <div id="chatError" class="chat-error" aria-live="polite"></div>
    </form>
  </main>

<div class="mobile_nav">
  <a href="/stats" class="active">
    <i class="fa-solid fa-chart-column"></i>
    <span>Stats</span>
  </a>

  <a href="/chat">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </a>

  <a href="/ranking">
    <i class="fa-solid fa-trophy"></i>
    <span>Ranking</span>
  </a>

  <a href="/market">
    <i class="fa-solid fa-store"></i>
    <span>Market</span>
  </a>

    <a href="/settings">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </a>

  <a href="/panel">
    <i class="fa-solid fa-wrench"></i>
    <span>Panel</span>
  </a>
</div>

<script src="/js/profile-dropdown.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/auth/checkSession.js"></script>
<script src="/js/auth/panelAuth.js"></script>
</body>
</html>
