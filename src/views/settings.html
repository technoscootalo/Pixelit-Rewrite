<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>

  <link rel="stylesheet" href="/styles/settings.css">
  <link rel="stylesheet" href="/styles/navbar.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="icon" type="image/png" href="https://izumiihd.github.io/pixelitcdn/assets/img/favicon.ico">
</head>

<body>

<nav>
  <h1 class="logo"
    onclick="window.location.href='/'"
    style="cursor:pointer; transition:0.2s;"
    onmouseover="this.style.opacity='0.7'"
    onmouseout="this.style.opacity='1'">
    Pixelit
  </h1>
  <br>
  
  <div class="profile-container">
    <div class="profile-row">
      <img src="https://izumiihd.github.io/pixelitcdn/assets/img/blooks/logo.png" id="profilePic" class="profile-pic" alt="Profile" />
      <span class="profile-name" id="profileName">User</span>
      <i class="fa-solid fa-chevron-down profile-arrow"></i>
    </div>
    <div class="profile-dropdown-menu">
      <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="/" onclick="handleLogout(event)">
      <i class="fa-solid fa-sign-out-alt"></i> Logout
      </a>   
    </div>
  </div>
  <br>
  
  <div class="icons">
    <a href="/stats"><i class="fa-solid fa-chart-column"></i> Stats</a>
    <a href="/chat"><i class="fa-solid fa-comments"></i> Chat</a>
    <a href="/ranking"><i class="fa-solid fa-trophy"></i> Ranking</a>
    <a href="/market"><i class="fa-solid fa-store"></i> Market</a>
    <a href="/pixels"><i class="fa-solid fa-suitcase"></i> Pixels</a>
    <a href="#" id="newsBtn"><i class="fa-solid fa-newspaper"></i> News</a>   
    <a href="/panel" id="panelLink"><i class="fa-solid fa-wrench"></i> Panel</a>
    <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="/credits"><i class="fa-solid fa-heart"></i> Credits</a>
  </div>
  <br>
  <div class="bottomIcons">
</nav>

<div class="background"></div>

<div id="newsSidebarOverlay"></div>

<aside id="newsSidebar" class="news-sidebar" aria-hidden="true">
  <div class="news-sidebar-header">
    <div class="news-sidebar-header-title">
      <i class="far fa-newspaper" aria-hidden="true"></i>
      <span><span class="pixelitLogo">Pixelit</span> News</span>
    </div>

    <button
      type="button"
      class="news-sidebar-close"
      data-news-sidebar-close
      aria-label="Close news"
    >
      &times;
    </button>
  </div>
  <div class="news-sidebar-content">
    <div id="newsSidebarArticles"></div>
  </div>
</aside>

<main>
  <div class="main-content">

    <h1 class="page-title">Settings</h1>

    <div class="content-container">

      <div class="profile-section">
        <h1 class="profile-title"   >Profile</h1>
        <hr class="separator"/>

        <div class="profile-details">
          <h3 id="username"></h3>
          <h3 id="date"></h3>
          <h3 id="id"></h3>
          <h3 id="accessKey"></h3>

          <hr class="separator"/>
          <!-- <h3>
            <a href="/store" class="visit-store">
              Visit Store <i class="fa-solid fa-cart-shopping"></i>
            </a>
          </h3> -->

          <h3>
            <i class="fa-solid fa-heart"></i>
            <a href="/credits" class="credits">Credits</a>
          </h3>

          <h3>
            <i class="fa-brands fa-discord"></i>
            <a href="https://discord.gg/KXvHan3C8R" class="discord">Discord</a>
          </h3>

          <h3 id="devLink">
            <i class="fa-solid fa-code"></i>
            <a href="/developer" class="developer">Developer</a>
          </h3>

          <h3>
            <i class="fa-solid fa-right-from-bracket"></i>
            <a href="/" class="sign-out" onclick="logout()">Sign Out</a>
          </h3>
        </div>
      </div>

      <div class="edit-info-section">
        <h1 class="edit-info-title">Edit Info</h1>
        <hr class="separator"/>

        <div class="edit-info-details">
          <h3 id="changeUsername" class="changeUser">Change Username</h3>
          <h3 id="changePassword" class="changePass">Change Password (disabled)</h3>
        </div>
      </div>

    </div>
  </div>
</main>

<div class="mobile_nav">
  <a href="/stats" class="active">
    <i class="fa-solid fa-chart-column"></i>
    <span>Stats</span>
  </a>

  <a href="/chat">
    <i class="fa-solid fa-comments"></i>
    <span>Chat</span>
  </a>

  <a href="/ranking">
    <i class="fa-solid fa-trophy"></i>
    <span>Ranking</span>
  </a>

  <a href="/market">
    <i class="fa-solid fa-store"></i>
    <span>Market</span>
  </a>

  <a href="/pixels">
    <i class="fa-solid fa-suitcase"></i>
    <span>Pixels</span>
  </a>

  <a href="/panel" id="panelLink">
    <i class="fa-solid fa-wrench"></i>
    <span>Panel</span>
  </a>

  <a href="/settings">
    <i class="fa-solid fa-gear"></i>
    <span>Settings</span>
  </a>

  <a href="/credits">
    <i class="fa-solid fa-heart"></i>
    <span>Credits</span>
  </a>
</div>

<script src="/js/profile-dropdown.js"></script>
<script src="/js/loadingModal.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/newsSider.js"></script>
<script src="/js/auth/checkSession.js"></script>
<script src="/js/auth/panelAuth.js"></script>

</body>
</html>
